<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Show notes — Juanito Pascual</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1a0d12">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' x='4' font-size='26'>✅</text></svg>">
<!--
  Show-day checklist. Every line comes from `showNotes` in ../config.js;
  this file only draws it. Ticks are remembered in this phone's browser
  (localStorage) so the list survives a reload mid-show, and "Start fresh"
  clears them for the next night. Prints as a plain black-on-white list.
-->
<style>
  @font-face{font-family:"Cormorant Garamond";font-style:normal;font-weight:600;font-display:swap;
    src:url("../assets/fonts/cormorant-600.woff2") format("woff2")}
  :root{
    --ink:#1a0d12;--gold:#dcb468;--gold-bright:#f4d79a;--muted:#d2bcc4;
    --paper:#faf4ee;--line:rgba(220,180,104,.26);
    --display:"Cormorant Garamond",Georgia,serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --tap:62px;color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(120% 70% at 50% -10%,#3a1a26 0%,transparent 60%),var(--ink);
    background-attachment:fixed;color:var(--paper);font-family:var(--body);font-size:16px;
    line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh}
  a,button,label{touch-action:manipulation}
  .wrap{width:100%;max-width:560px;margin:0 auto;
    padding:clamp(26px,6vw,46px) 16px calc(44px + env(safe-area-inset-bottom))}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(34px,9vw,44px);line-height:1.05;margin:0 0 8px}
  .lede{color:var(--muted);margin:0 0 6px}
  .show{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:#eda7b7;margin:0 0 26px}
  .done{font-size:15px;color:var(--muted);margin:0 0 22px}
  .done b{color:var(--gold-bright)}

  section{margin:0 0 26px}
  h2{font-family:var(--display);font-weight:600;font-size:26px;color:var(--gold-bright);margin:0 0 8px}
  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
  label.item{display:flex;align-items:flex-start;gap:14px;min-height:var(--tap);padding:12px 14px;
    border:1px solid var(--line);border-radius:14px;background:rgba(250,244,238,.05);cursor:pointer;
    -webkit-tap-highlight-color:transparent}
  label.item input{flex:none;width:28px;height:28px;margin:2px 0 0;accent-color:var(--gold)}
  label.item span{font-size:17px;line-height:1.45}
  label.item.on{background:transparent;border-style:dashed}
  label.item.on span{color:var(--muted);text-decoration:line-through;text-decoration-color:rgba(220,180,104,.6)}
  label.item input:focus-visible{outline:3px solid var(--gold-bright);outline-offset:2px}

  .stack{display:flex;flex-direction:column;gap:12px;margin:8px 0 24px}
  .btn{display:flex;align-items:center;justify-content:center;min-height:var(--tap);width:100%;
    padding:14px 18px;font:inherit;font-size:18px;font-weight:600;cursor:pointer;
    border:1px solid var(--line);border-radius:15px;background:rgba(250,244,238,.06);color:var(--paper)}
  .btn.quiet{background:transparent;border-style:dashed;color:var(--muted);font-weight:500}
  .btn:active{filter:brightness(1.15)}
  .foot{font-size:14px;color:var(--muted);line-height:1.6;border-top:1px solid rgba(250,244,238,.1);padding-top:16px;margin:0}
  .foot a{color:var(--gold-bright)}
  .empty{color:#ffe8ec;background:#7a1f2e;border:1px dashed #ff9fae;padding:13px 16px;border-radius:11px;font-size:14px}

  @media print{
    @page{size:letter;margin:.6in .6in}
    html,body{background:#fff!important;color:#191210}
    .wrap{max-width:none;padding:0}
    h1{color:#191210;font-size:30pt}
    .lede,.done,.stack,.foot{display:none}
    .show{color:#5f5048}
    h2{color:#5a2d8c;font-size:20pt;margin-top:.1in}
    section{break-inside:avoid;margin-bottom:.18in}
    ul{gap:0}
    label.item{border:0;border-bottom:1px solid #cfc5bb;border-radius:0;background:none;
      padding:.06in 0;min-height:0;gap:.12in}
    label.item.on{border-style:solid}
    label.item input{-webkit-appearance:none;appearance:none;width:.22in;height:.22in;
      border:1.5px solid #191210;border-radius:.03in;margin-top:.03in}
    label.item input:checked::after{content:"";display:block;width:.07in;height:.13in;margin:.01in auto 0;
      border:solid #191210;border-width:0 2px 2px 0;transform:rotate(45deg)}
    label.item span{color:#191210!important;font-size:12.5pt;text-decoration:none!important}
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Show notes</h1>
  <p class="lede">The night, in order. Tap a line when it's done.</p>
  <p class="show" id="show"></p>
  <p class="done" id="done"></p>
  <div id="list"></div>
  <div class="stack">
    <button class="btn" type="button" onclick="window.print()">Print this list</button>
    <button class="btn quiet" type="button" id="reset">Start fresh for the next show</button>
  </div>
  <p class="foot">Ticks are remembered on this phone only. To change the words, Mike edits the
    notes list in the site's config. Also yours: <a href="../print/">print your signs</a> and the
    <a href="../guests/">guest list</a>.</p>
</main>
<script src="../config.js"></script>
<script>
(function () {
  var S = window.SITE || {};
  var KEY = 'jp-shownotes';
  var groups = S.showNotes || [];
  var list = document.getElementById('list');

  function plain(s) { var t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }
  function esc(s) { return String(s == null ? '' : s).replace(/[<>"]/g, function (c) {
    return { '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  if (S.show) {
    var where = [S.show.venue, S.show.city].filter(Boolean).map(plain).join(' · ');
    var dates = (S.show.dates || []).map(plain).join(' · ');
    document.getElementById('show').textContent = [where, dates].filter(Boolean).join(' — ');
  }

  var ticks = {};
  try { ticks = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(ticks)); } catch (e) {} }

  var total = 0, html = '';
  if (!groups.length) html = '<p class="empty">No notes yet. Add a <code>showNotes</code> list to config.js.</p>';
  groups.forEach(function (g, gi) {
    html += '<section><h2>' + (g.when || '') + '</h2><ul>';
    (g.items || []).forEach(function (text, ii) {
      // Keyed by the words, so reordering lines never flips the wrong tick.
      var k = plain(text).slice(0, 80);
      var on = !!ticks[k];
      total++;
      html += '<li><label class="item' + (on ? ' on' : '') + '">' +
        '<input type="checkbox" data-k="' + esc(k) + '"' + (on ? ' checked' : '') + '>' +
        '<span>' + text + '</span></label></li>';
    });
    html += '</ul></section>';
  });
  list.innerHTML = html;

  var doneEl = document.getElementById('done');
  function count() {
    var n = list.querySelectorAll('input:checked').length;
    doneEl.innerHTML = total ? '<b>' + n + '</b> of <b>' + total + '</b> done' : '';
  }
  list.addEventListener('change', function (e) {
    var box = e.target;
    if (box.type !== 'checkbox') return;
    var k = box.getAttribute('data-k');
    if (box.checked) ticks[k] = 1; else delete ticks[k];
    box.closest('label').classList.toggle('on', box.checked);
    save(); count();
  });
  document.getElementById('reset').addEventListener('click', function () {
    if (!Object.keys(ticks).length || confirm('Untick everything?')) {
      ticks = {}; save();
      list.querySelectorAll('input').forEach(function (b) { b.checked = false; b.closest('label').classList.remove('on'); });
      count();
    }
  });
  count();
})();
</script>
</body>
</html>
