<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juanito Pascual — Merch &amp; Mailing List</title>
<meta name="description" content="CDs, the method book, and the mailing list.">
<meta name="theme-color" content="#1a0d12">
<meta property="og:title" content="Juanito Pascual — Merch &amp; Mailing List">
<meta property="og:description" content="CDs, the method book, and the mailing list.">
<meta property="og:image" content="assets/portrait.jpg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' x='4' font-size='26'>🎸</text></svg>">

<!-- Fonts are served from this site, not Google, so the page needs no other
     host to render. Preloaded because they draw the headings. -->
<link rel="preload" href="assets/fonts/cormorant-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/cormorant-italic-500.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face{
    font-family:"Cormorant Garamond";
    font-style:normal;font-weight:600;font-display:swap;
    src:url("assets/fonts/cormorant-600.woff2") format("woff2");
  }
  @font-face{
    font-family:"Cormorant Garamond";
    font-style:italic;font-weight:500;font-display:swap;
    src:url("assets/fonts/cormorant-italic-500.woff2") format("woff2");
  }

  :root{
    --ink:#1a0d12;
    --rose:#c2566e;
    --rose-soft:#eda7b7;
    --gold:#dcb468;
    --gold-bright:#f4d79a;
    --paper:#faf4ee;
    /* Lightened from the first draft: this text is read at arm's length in a
       dark room, often by people over fifty. Contrast is checked in the repo. */
    --muted:#d2bcc4;
    --line:rgba(220,180,104,.26);
    /* Body text is the phone's own face — San Francisco on an iPhone. It needs
       no download, renders on the first frame, and is what iOS users read all
       day. Only the display face is custom. */
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    --radius:15px;
    --tap:62px;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #3a1a26 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, #2b1018 0%, transparent 55%),
      var(--ink);
    background-attachment:fixed;
    color:var(--paper);
    font-family:var(--body);
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  /* Kills the 300ms tap delay on iOS without disabling pinch-zoom, which
     older viewers rely on. */
  a,button{touch-action:manipulation}

  .wrap{
    width:100%;max-width:460px;margin:0 auto;
    padding:clamp(26px,6vw,46px) 18px calc(44px + env(safe-area-inset-bottom));
  }

  /* ---- header ---- */
  header{text-align:center}
  .portrait,.monogram{
    width:124px;height:124px;border-radius:50%;
    display:block;margin:0 auto 18px;border:1px solid var(--line);
  }
  .portrait{
    object-fit:cover;
    box-shadow:0 0 0 5px rgba(220,180,104,.07),0 18px 40px -18px #000;
  }
  .monogram{
    display:flex;align-items:center;justify-content:center;
    font-family:var(--display);font-size:48px;color:var(--gold);
    background:linear-gradient(160deg,rgba(220,180,104,.15),rgba(194,86,110,.09));
  }
  .monogram span{display:block;margin-top:-4px;letter-spacing:.02em}

  .eyebrow{
    display:flex;flex-direction:column;gap:3px;align-items:center;
    margin:0 0 14px;font-size:12.5px;font-weight:600;
    letter-spacing:.1em;text-transform:uppercase;color:var(--rose-soft);
  }
  .eyebrow span:not(:first-child){color:var(--muted);letter-spacing:.08em}

  h1{
    font-family:var(--display);font-weight:600;
    font-size:clamp(36px,10vw,46px);line-height:1.04;
    margin:0 0 10px;text-wrap:balance;
  }
  .tagline{
    font-family:var(--display);font-style:italic;font-weight:500;
    font-size:clamp(19px,5vw,22px);color:var(--gold-bright);
    margin:0 0 10px;line-height:1.3;text-wrap:balance;
  }
  .sub{font-size:15px;color:var(--muted);margin:0;line-height:1.5}

  .rule{
    width:56px;height:1px;margin:30px auto;border:0;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .label{
    font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
    color:var(--muted);text-align:center;margin:0 0 18px;
  }

  /* ---- merch menu ---- */
  .menu{display:flex;flex-direction:column;gap:26px}
  .group h2{
    font-family:var(--display);font-weight:600;font-size:24px;
    margin:0 0 10px;color:var(--gold-bright);
  }
  .row{display:flex;align-items:baseline;gap:8px;padding:6px 0}
  .row-label{font-size:17px;min-width:0}
  .leader{
    flex:1;height:1px;min-width:14px;
    border-bottom:1px dotted rgba(220,180,104,.4);
    transform:translateY(-4px);
  }
  .row-price{
    font-size:18px;font-weight:600;color:var(--gold);
    font-variant-numeric:tabular-nums;flex:none;
  }
  .titles{
    list-style:none;margin:11px 0 0;padding:0;
    display:flex;flex-direction:column;gap:4px;
  }
  .titles li{
    font-family:var(--display);font-style:italic;font-weight:500;
    font-size:17px;color:var(--muted);line-height:1.35;
  }
  .titles li::before{content:"· ";color:var(--rose)}
  .soon{margin:0;font-size:15px;color:var(--muted);font-style:italic;line-height:1.5}

  /* ---- buttons & rows ---- */
  .stack{display:flex;flex-direction:column;gap:12px}
  .btn{
    display:flex;align-items:center;gap:15px;
    min-height:var(--tap);padding:14px 18px;
    border:1px solid var(--line);border-radius:var(--radius);
    background:rgba(250,244,238,.05);color:var(--paper);
    font:inherit;text-align:left;text-decoration:none;width:100%;
    transition:transform .14s ease,background .14s ease,border-color .14s ease;
    -webkit-tap-highlight-color:transparent;
  }
  a.btn:active{transform:scale(.985);background:rgba(250,244,238,.1)}
  .btn:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px}
  @media(hover:hover){
    a.btn:hover{background:rgba(250,244,238,.09);border-color:rgba(220,180,104,.5)}
  }
  .btn .txt{flex:1;min-width:0}
  .btn b{display:block;font-size:18px;font-weight:600;line-height:1.25}
  .btn small{display:block;font-size:14px;color:var(--muted);margin-top:3px;line-height:1.4}
  .btn small b{display:inline;font-size:inherit;color:var(--paper)}
  .btn .arrow{flex:none;color:var(--gold);font-size:20px;opacity:.8}
  .ico{
    flex:none;width:42px;height:42px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(220,180,104,.12);border:1px solid var(--line);
    color:var(--gold);
  }
  .ico svg{width:22px;height:22px;display:block}

  .btn.as-row{cursor:default}
  .btn.quiet{background:transparent;border-style:dashed;border-color:rgba(220,180,104,.2)}

  .copy{
    flex:none;font:inherit;font-size:15px;font-weight:600;
    padding:11px 18px;min-height:46px;
    border:1px solid var(--line);border-radius:999px;
    background:rgba(220,180,104,.14);color:var(--gold-bright);
    cursor:pointer;-webkit-tap-highlight-color:transparent;
  }
  .copy:active{background:rgba(220,180,104,.26)}
  .copy:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px}
  .copyval{margin:-5px 0 0;text-align:center;font-size:15px;color:var(--muted)}
  .copyval code{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:15px;color:var(--rose-soft);
    user-select:all;-webkit-user-select:all;
  }

  .btn.primary{
    background:linear-gradient(140deg,var(--gold) 0%,#c99a4c 100%);
    border-color:var(--gold-bright);color:#20101a;
    box-shadow:0 10px 28px -14px rgba(220,180,104,.75);
  }
  .btn.primary small{color:rgba(32,16,26,.72)}
  .btn.primary .arrow{color:#20101a;opacity:.65}
  .btn.primary .ico{
    background:rgba(32,16,26,.12);border-color:rgba(32,16,26,.2);color:#20101a;
  }
  @media(hover:hover){.btn.primary:hover{filter:brightness(1.06);border-color:#fff}}

  /* ---- secondary links ---- */
  .links{
    display:flex;flex-wrap:wrap;justify-content:center;gap:9px 7px;
    margin:0;padding:0;list-style:none;
  }
  .links a{
    display:inline-block;padding:11px 17px;min-height:46px;line-height:24px;
    font-size:15px;color:var(--muted);text-decoration:none;
    border:1px solid rgba(250,244,238,.13);border-radius:999px;
    -webkit-tap-highlight-color:transparent;
  }
  .links a:focus-visible{outline:3px solid var(--gold-bright);outline-offset:3px}
  @media(hover:hover){.links a:hover{color:var(--gold-bright);border-color:var(--line)}}

  footer{
    text-align:center;font-size:14px;line-height:1.6;
    color:var(--muted);margin-top:36px;
  }

  #toast{
    position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
    transform:translate(-50%,14px);max-width:calc(100vw - 36px);
    padding:13px 20px;border:1px solid var(--line);border-radius:999px;
    background:#2e161f;color:var(--paper);font-size:15px;
    box-shadow:0 14px 34px -12px #000;
    opacity:0;pointer-events:none;z-index:10;
    transition:opacity .18s ease,transform .18s ease;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  .warn{
    background:#7a1f2e;color:#ffe8ec;border:1px dashed #ff9fae;
    padding:13px 16px;border-radius:11px;font-size:14px;
    margin-bottom:20px;line-height:1.5;
  }
  .warn code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
