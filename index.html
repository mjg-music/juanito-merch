<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juanito Pascual — Preorder &amp; Mailing List</title>
<meta name="description" content="Preorder Gold &amp; Rose and join the mailing list.">
<meta name="theme-color" content="#1a0d12">
<meta property="og:title" content="Juanito Pascual — Gold &amp; Rose">
<meta property="og:description" content="Preorder the new album and join the mailing list.">
<meta property="og:type" content="music.album">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' x='4' font-size='26'>🎸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a0d12;
    --ink-2:#2a141c;
    --rose:#c2566e;
    --rose-soft:#e08fa2;
    --gold:#d8ae5f;
    --gold-bright:#f0cd86;
    --paper:#f6eee6;
    --muted:#b79aa4;
    --line:rgba(216,174,95,.22);
    --radius:14px;
    --tap:58px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #3a1a26 0%, transparent 60%),
      radial-gradient(90% 60% at 50% 110%, #2b1018 0%, transparent 55%),
      var(--ink);
    background-attachment:fixed;
    color:var(--paper);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  .wrap{
    width:100%;
    max-width:460px;
    margin:0 auto;
    padding:clamp(28px,7vw,52px) 16px calc(40px + env(safe-area-inset-bottom));
  }

  /* ---- header ---- */
  header{text-align:center}
  .portrait{
    width:118px;height:118px;border-radius:50%;
    object-fit:cover;display:block;margin:0 auto 20px;
    border:1px solid var(--line);
    box-shadow:0 0 0 5px rgba(216,174,95,.06), 0 18px 40px -18px #000;
  }
  .monogram{
    width:118px;height:118px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    margin:0 auto 20px;
    font-family:"Cormorant Garamond",Georgia,serif;
    font-size:46px;color:var(--gold);
    border:1px solid var(--line);
    background:linear-gradient(160deg,rgba(216,174,95,.14),rgba(194,86,110,.08));
  }
  h1{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-weight:600;
    font-size:clamp(32px,9vw,42px);
    line-height:1.05;
    margin:0 0 10px;
    letter-spacing:.005em;
  }
  .tagline{
    font-family:"Cormorant Garamond",Georgia,serif;
    font-style:italic;
    font-size:clamp(17px,4.6vw,20px);
    color:var(--gold-bright);
    margin:0 0 10px;
    line-height:1.35;
  }
  .note{
    font-size:13.5px;color:var(--muted);margin:0;line-height:1.5;
    letter-spacing:.01em;
  }
  .rule{
    width:54px;height:1px;margin:26px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    border:0;
  }

  /* ---- sections ---- */
  .label{
    font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    color:var(--muted);text-align:center;margin:0 0 14px;
  }
  .price{
    text-align:center;font-size:13.5px;color:var(--rose-soft);
    margin:-4px 0 16px;line-height:1.5;
  }
  .stack{display:flex;flex-direction:column;gap:11px}

  /* ---- buttons ---- */
  .btn{
    display:flex;align-items:center;gap:14px;
    min-height:var(--tap);
    padding:12px 18px;
    border-radius:var(--radius);
    text-decoration:none;
    background:rgba(246,238,230,.045);
    border:1px solid var(--line);
    color:var(--paper);
    transition:transform .14s ease, background .14s ease, border-color .14s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:active{transform:scale(.985);background:rgba(246,238,230,.09)}
  @media(hover:hover){.btn:hover{background:rgba(246,238,230,.085);border-color:rgba(216,174,95,.45)}}
  .btn .txt{flex:1;min-width:0}
  .btn b{display:block;font-size:16.5px;font-weight:600;letter-spacing:.005em}
  .btn small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
  .btn .arrow{color:var(--gold);font-size:17px;flex:none;opacity:.75}
  .ico{
    flex:none;width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(216,174,95,.1);
    border:1px solid var(--line);
  }
  .ico svg{width:20px;height:20px;display:block}

  /* primary = email signup */
  .btn.primary{
    background:linear-gradient(140deg,var(--gold) 0%,#c99a4c 100%);
    border-color:var(--gold-bright);
    color:#23121a;
    box-shadow:0 10px 26px -14px rgba(216,174,95,.7);
  }
  .btn.primary small{color:rgba(35,18,26,.66)}
  .btn.primary .arrow{color:#23121a;opacity:.6}
  .btn.primary .ico{background:rgba(35,18,26,.1);border-color:rgba(35,18,26,.18)}
  @media(hover:hover){.btn.primary:hover{filter:brightness(1.06);border-color:#fff}}

  /* ---- ship note ---- */
  .shipnote{
    margin:14px 0 0;padding:12px 15px;
    border-left:2px solid var(--rose);
    background:rgba(194,86,110,.1);
    border-radius:0 10px 10px 0;
    font-size:13px;line-height:1.5;color:#f0dbe1;
  }

  /* ---- secondary links ---- */
  .links{
    display:flex;flex-wrap:wrap;justify-content:center;gap:8px 6px;
    margin:0;padding:0;list-style:none;
  }
  .links a{
    display:inline-block;padding:9px 14px;min-height:40px;line-height:22px;
    font-size:13.5px;color:var(--muted);text-decoration:none;
    border:1px solid rgba(246,238,230,.1);border-radius:999px;
    -webkit-tap-highlight-color:transparent;
  }
  .links a:active{color:var(--paper);border-color:var(--line)}
  @media(hover:hover){.links a:hover{color:var(--gold-bright);border-color:var(--line)}}

  footer{
    text-align:center;font-size:12.5px;color:rgba(183,154,164,.75);
    margin-top:34px;line-height:1.6;
  }

  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  .warn{
    background:#7a1f2e;color:#ffe8ec;border:1px dashed #ff9fae;
    padding:11px 14px;border-radius:10px;font-size:12.5px;
    margin-bottom:18px;line-height:1.5;
  }
  .warn code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
  <main class="wrap" id="app"></main>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
